name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Compile check
        run: python -m compileall -q backend scripts
      - name: Run tests
        working-directory: backend
        run: python -m pytest -q tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: frontend
        run: npm install
      # Known pre-existing TypeScript errors; non-blocking until they are fixed.
      - name: Type check
        continue-on-error: true
        working-directory: frontend
        run: |
          set -o pipefail
          npm run lint -- --pretty false 2>&1 | tee "$RUNNER_TEMP/tsc.txt"
      - name: Type errors 1-10
        run: bash .github/scripts/ts-annotations.sh 0
      - name: Type errors 11-20
        run: bash .github/scripts/ts-annotations.sh 1
      - name: Type errors 21-30
        run: bash .github/scripts/ts-annotations.sh 2
      - name: Type errors 31-40
        run: bash .github/scripts/ts-annotations.sh 3
      - name: Type errors 41-50
        run: bash .github/scripts/ts-annotations.sh 4
      - name: Type errors 51-60
        run: bash .github/scripts/ts-annotations.sh 5
      - name: Type errors 61-70
        run: bash .github/scripts/ts-annotations.sh 6
      - name: Type errors 71-80
        run: bash .github/scripts/ts-annotations.sh 7
      - name: Type errors 81-90
        run: bash .github/scripts/ts-annotations.sh 8
      - name: Type errors 91-100
        run: bash .github/scripts/ts-annotations.sh 9
      - name: Build
        working-directory: frontend
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t torrent-studio:ci .
