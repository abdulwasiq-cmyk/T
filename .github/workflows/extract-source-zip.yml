name: Extract uploaded source ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'new-test-main.zip'
      - '.github/workflows/extract-source-zip.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract source archive into repository root
        run: |
          set -euo pipefail
          test -f new-test-main.zip
          mkdir -p /tmp/source-zip
          unzip -q new-test-main.zip -d /tmp/source-zip
          root="$(find /tmp/source-zip -type f -path '*/frontend/package.json' -print -quit | sed 's#/frontend/package.json$##')"
          test -n "$root"
          # Copy source files into the repository, excluding Git metadata.
          rsync -a --exclude='.git/' --exclude='.github/' "$root/" ./
          test -f backend/fullstack_app.py
          test -f frontend/package.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No extracted file changes to commit.'
          else
            git commit -m 'Extract new-test source into repository'
            git push origin HEAD:main
          fi
